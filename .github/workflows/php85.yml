name: PHP 8.5 compatibility

on: [push, pull_request]

jobs:
  php85:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd, intl, ldap, pdo_mysql
      - name: Lint all PHP source files
        run: find . -name '*.php' -not -path './vendor/*' -not -path './.Build/*' -not -path './.git/*' -print0 | xargs -0 -n 1 php -l
      - name: Require a supported framework runtime before declaring compatibility
        run: |
          echo '::error::This checkout supports TYPO3 6.2–7 and has no Composer runtime or test harness. PHP 8.5 compatibility requires a framework compatibility migration; syntax lint alone does not prove compatibility.'
          exit 1
